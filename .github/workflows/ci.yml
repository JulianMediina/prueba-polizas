name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests + cobertura)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, tests unitarios e integración (PostgreSQL embebido), JaCoCo ≥ 80 %
        run: ./mvnw -B -ntp verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production
      - name: El index.html no debe tener scripts en línea (los bloquea la CSP)
        run: |
          if grep -Eq '<script>|onload=' dist/frontend/browser/index.html; then
            echo "::error::index.html tiene scripts en línea; la CSP script-src 'self' los bloquearía"; exit 1
          fi
      - name: La API key nunca debe estar en el bundle
        run: |
          if grep -rqi "x-api-key" dist/; then
            echo "::error::El bundle del frontend referencia x-api-key"; exit 1
          fi
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (docker compose + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Variables de prueba
        run: |
          {
            echo "API_KEY=123456"
            echo "DB_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Levantar el stack completo
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test de punta a punta
        run: |
          set -euo pipefail
          FRONT=http://localhost:8080 API=http://localhost:8081 KEY="x-api-key: 123456"
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code "$FRONT/")" = 200 ]                                   && echo "✔ SPA"
          [ "$(code "$FRONT/poliza/1")" = 200 ]                           && echo "✔ ruta profunda de la SPA"
          [ "$(code "$FRONT/api/polizas?size=1")" = 200 ]                 && echo "✔ BFF /api agrega la key"
          [ "$(code "$API/polizas")" = 401 ]                              && echo "✔ 401 sin x-api-key"
          [ "$(code -H "$KEY" "$API/polizas?tipo=COLECTIVA&estado=ACTIVA")" = 200 ] && echo "✔ listar"
          [ "$(code -H "$KEY" -X POST "$API/polizas/1/renovar")" = 200 ] && echo "✔ renovar"
          [ "$(code -H "$KEY" -X POST "$API/polizas/3/renovar")" = 409 ] && echo "✔ 409 renovar cancelada"
          [ "$(code -H "$KEY" -X POST "$API/riesgos/1/cancelar")" = 422 ] && echo "✔ 422 riesgo de individual"
          [ "$(code -H "$KEY" -X POST "$API/polizas/6/cancelar")" = 200 ] && echo "✔ cancelar"
          sleep 3
          docker compose logs backend | grep -q "CORE-MOCK evento=ACTUALIZACION polizaId=1" \
            && echo "✔ el CORE-MOCK registró la renovación"
          docker compose logs backend | grep -q "CORE-MOCK evento=ACTUALIZACION polizaId=6" \
            && echo "✔ el CORE-MOCK registró la cancelación"
      - name: Logs si falla
        if: failure()
        run: docker compose logs --tail 200

  infra:
    name: IaC (fmt + validate + tflint + Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for dir in infra/bootstrap infra/envs/demo; do
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/infra/.tflint.hcl"
          cd infra && tflint --recursive --config "$(pwd)/.tflint.hcl"
      - name: Trivy (misconfiguraciones IaC y Dockerfiles, informativo)
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.76.0 config --quiet --severity HIGH,CRITICAL \
            --exit-code 0 /repo

  secretos:
    name: Escaneo de secretos (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks sobre todo el historial
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
